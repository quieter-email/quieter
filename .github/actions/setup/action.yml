name: Setup repository
description: Shared Vite+ toolchain setup for all CI jobs. Requires a prior actions/checkout.

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        version-file: pnpm-workspace.yaml
        node-version-file: .node-version
        cache: true
        cache-toolchain: true
        run-install: false

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile

    - name: Build environment package
      shell: bash
      run: vp run @quieter/env#build

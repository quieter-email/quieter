name: Deploy SST Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_state:
        description: Run sst refresh before planning (auto skips it unless an emergency web recovery ran since the last deploy)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - always

permissions:
  contents: read

concurrency:
  group: quieter-deploy-production
  cancel-in-progress: false

jobs:
  prior-checks:
    name: Find verified commit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - name: Find successful merge queue verification
        id: evidence
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput("reuse", "false");
            if (context.eventName !== "push" || context.ref !== "refs/heads/main") {
              core.info("Running fresh release verification.");
              return;
            }

            try {
              const { owner, repo } = context.repo;
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci-main.yml",
                event: "merge_group",
                head_sha: context.sha,
                per_page: 100,
              });
              const runs = data.workflow_runs;
              if (runs.length === 0 || data.total_count !== runs.length || runs.some((run) =>
                run.status !== "completed" || !Number.isFinite(Date.parse(run.updated_at)))) {
                core.info("No complete merge queue evidence; running all checks.");
                return;
              }

              runs.sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at) || b.id - a.id);
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runs[0].id,
              });
              if (run.event !== "merge_group" || run.head_sha !== context.sha ||
                !Number.isInteger(run.id) || run.id < 1 ||
                !Number.isInteger(run.run_attempt) || run.run_attempt < 1 ||
                run.path !== ".github/workflows/ci-main.yml" ||
                run.head_repository?.full_name !== `${owner}/${repo}` ||
                !run.head_branch?.startsWith("gh-readonly-queue/main/") ||
                run.status !== "completed" || run.conclusion !== "success") {
                core.info("Latest verification is not successful evidence for this commit; running all checks.");
                return;
              }

              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, filter: "latest", per_page: 100,
              });
              if (jobs.jobs.length === 0 || jobs.total_count !== jobs.jobs.length ||
                jobs.jobs.some((job) => job.status !== "completed" || job.conclusion !== "success" ||
                  job.run_id !== run.id || job.run_attempt !== run.run_attempt)) {
                core.info("Verification jobs are incomplete or unsuccessful; running all checks.");
                return;
              }

              const { data: current } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: run.id,
              });
              if (current.run_attempt !== run.run_attempt || current.updated_at !== run.updated_at ||
                current.status !== "completed" || current.conclusion !== "success") {
                core.info("Verification changed during lookup; running all checks.");
                return;
              }

              const url = `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
              await core.summary.addHeading("Reused verification")
                .addLink(`Successful merge queue checks for ${context.sha}`, url).write();
              core.setOutput("reuse", "true");
            } catch (error) {
              core.warning(`Could not confirm prior verification; running all checks. ${error.message}`);
            }

  verify:
    name: Verify release
    needs: prior-checks
    if: ${{ !cancelled() && needs.prior-checks.outputs.reuse != 'true' }}
    uses: ./.github/workflows/ci-main.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy production
    needs: [prior-checks, verify]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (needs.verify.result == 'success' ||
           (needs.prior-checks.result == 'success' &&
            needs.prior-checks.outputs.reuse == 'true' && needs.verify.result == 'skipped')) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    timeout-minutes: 35
    env:
      SST_STAGE: production
      QUIETER_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      BETTER_AUTH_APP_NAME: ${{ vars.BETTER_AUTH_APP_NAME }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      GMAIL_PUBSUB_PUSH_AUDIENCE: ${{ vars.GMAIL_PUBSUB_PUSH_AUDIENCE }}
      GMAIL_PUBSUB_PUSH_SERVICE_ACCOUNT: ${{ vars.GMAIL_PUBSUB_PUSH_SERVICE_ACCOUNT }}
      GMAIL_PUBSUB_SUBSCRIPTION: ${{ vars.GMAIL_PUBSUB_SUBSCRIPTION }}
      GMAIL_PUBSUB_TOPIC: ${{ vars.GMAIL_PUBSUB_TOPIC }}
      POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
      POLAR_PRODUCT_MANAGED_ID: ${{ vars.POLAR_PRODUCT_MANAGED_ID }}
      POLAR_PRODUCT_PRO_ID: ${{ vars.POLAR_PRODUCT_PRO_ID }}
      POLAR_SANDBOX: ${{ vars.POLAR_SANDBOX }}
      QUIETER_AUTH_MAIL_MODE: ${{ vars.QUIETER_AUTH_MAIL_MODE }}
      QUIETER_AUTH_MAIL_SENDER: ${{ vars.QUIETER_AUTH_MAIL_SENDER }}
      QUIETER_GMAIL_AI_AUTOMATION_ENABLED: ${{ vars.QUIETER_GMAIL_AI_AUTOMATION_ENABLED }}
      QUIETER_PREVIEW_PERSONAS_ENABLED: ${{ vars.QUIETER_PREVIEW_PERSONAS_ENABLED }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_URL: ${{ vars.SENTRY_URL }}
      VITE_LOGO_DEV_PUBLISHABLE_KEY: ${{ vars.VITE_LOGO_DEV_PUBLISHABLE_KEY }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_QUIETER_PREVIEW_PERSONAS_ENABLED: ${{ vars.VITE_QUIETER_PREVIEW_PERSONAS_ENABLED }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Install infrastructure type definitions
        run: vp exec sst install --stage "$SST_STAGE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Build deployment configuration
        run: |
          vp run @quieter/observability#build
          vp run quieter#build

      - name: Prepare web release routing
        run: vp exec node scripts/web-release.ts prepare https://quieter.email "$QUIETER_BUILD_ID"

      # Emergency web recoveries change the live worker outside SST, so state
      # needs a refresh afterwards. Normal deploys only go through SST, in
      # which case the ~100s refresh is pure overhead and skipped.
      - name: Check for recovery drift since last deploy
        id: drift-check
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REFRESH_STATE: ${{ inputs.refresh_state || 'auto' }}
        run: |
          if [[ "$REFRESH_STATE" == "always" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_deploy="$(gh api "repos/$GH_REPO/actions/workflows/sst-deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].updated_at // empty')"
          last_recovery="$(gh api "repos/$GH_REPO/actions/workflows/web-recovery.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].updated_at // empty')"
          if [[ -z "$last_deploy" || (-n "$last_recovery" && "$last_recovery" > "$last_deploy") ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare web asset directories
        # Refresh can still read the previous release's asset path during migration.
        run: mkdir -p apps/web/dist/client apps/web/.cloudflare/output/v0/workers/default/assets

      - name: Refresh SST state
        if: steps.drift-check.outputs.refresh == 'true'
        timeout-minutes: 20
        run: vp exec sst refresh --config sst.config.ts --stage "$SST_STAGE"

      - name: Preview production changes
        timeout-minutes: 10
        run: vp run sst diff --config sst.config.ts --stage "$SST_STAGE"

      - name: Upload SST logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sst-logs
          path: .sst/log/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Record previous healthy web version
        run: vp exec node scripts/web-recovery.ts record previous-web.json

      - name: Retain web recovery record before deployment
        uses: actions/upload-artifact@v7
        with:
          name: previous-web
          path: previous-web.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Verify web release routing has not drifted
        run: vp exec node scripts/web-release.ts verify https://quieter.email "$QUIETER_BUILD_ID"

      - name: Apply production database migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          QUIETER_ALLOW_REMOTE_MIGRATIONS: production
        run: vp run @quieter/database#db:deploy

      - name: Inspect database connections before deployment
        continue-on-error: true
        timeout-minutes: 2
        run: vp exec sst shell --stage "$SST_STAGE" -- node packages/database/scripts/inspect-connections.ts

      - name: Deploy prepared build with SST
        id: deploy
        run: vp run sst deploy --config sst.config.ts --stage "$SST_STAGE"

      - name: Inspect database connections after deployment
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: vp exec sst shell --stage "$SST_STAGE" -- node packages/database/scripts/inspect-connections.ts

      - name: Verify signed mail updates
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 2
        # Cloudflare Worker shell targets do not export their linked secrets.
        run: vp exec sst shell --stage "$SST_STAGE" -- node scripts/check-mail-updates.ts https://updates.quieter.email

      - name: Verify production release
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 5
        run: vp exec node scripts/check-deployment.ts https://quieter.email "$QUIETER_BUILD_ID" https://updates.quieter.email/mail/live

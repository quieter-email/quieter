name: Deploy SST Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap_web_asset_archive:
        description: Allow the one-time deployment that creates the web asset archive
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quieter-deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci-main.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy production
    needs: verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 35
    env:
      QUIETER_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}
      SST_STAGE: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Build deployment configuration
        run: |
          vp run @quieter/observability#build
          vp run @quieter/sdk#build

      # Once archive-aware releases are live, never replace one until its
      # release marker proves its R2 upload completed.
      - name: Verify current web asset archive
        env:
          QUIETER_ALLOW_WEB_ASSET_ARCHIVE_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_web_asset_archive }}
        run: vp run verify:web-asset-archive

      - name: Configure production runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.GMAIL_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          node -e '
            const databaseName = decodeURIComponent(new URL(process.env.DATABASE_URL).pathname.replace(/^\//u, ""));
            if (databaseName !== "quieter") {
              throw new Error(`Production DATABASE_URL must target the quieter database, received ${databaseName || "an empty database name"}.`);
            }
          '
          vp exec sst secret set CloudflareAccountId "$CLOUDFLARE_ACCOUNT_ID" --stage "$SST_STAGE"
          vp exec sst secret set CloudflareAiApiToken "$CLOUDFLARE_AI_API_TOKEN" --stage "$SST_STAGE"
          vp exec sst secret set DatabaseUrl "$DATABASE_URL" --stage "$SST_STAGE"
          vp exec sst secret set GmailCredentialRotationToken "$GMAIL_CREDENTIAL_ROTATION_TOKEN" --stage "$SST_STAGE"

      - name: Apply production database migrations
        if: ${{ env.SST_STAGE == 'production' }}
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          QUIETER_ALLOW_REMOTE_MIGRATIONS: production
        run: vp run @quieter/database#db:deploy

      - name: Deploy with SST
        env:
          BETTER_AUTH_APP_NAME: ${{ vars.BETTER_AUTH_APP_NAME }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          GMAIL_PUBSUB_PUSH_AUDIENCE: ${{ vars.GMAIL_PUBSUB_PUSH_AUDIENCE }}
          GMAIL_PUBSUB_PUSH_SERVICE_ACCOUNT: ${{ vars.GMAIL_PUBSUB_PUSH_SERVICE_ACCOUNT }}
          GMAIL_PUBSUB_SUBSCRIPTION: ${{ vars.GMAIL_PUBSUB_SUBSCRIPTION }}
          GMAIL_PUBSUB_TOPIC: ${{ vars.GMAIL_PUBSUB_TOPIC }}
          POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
          POLAR_PRODUCT_MANAGED_ID: ${{ vars.POLAR_PRODUCT_MANAGED_ID }}
          POLAR_PRODUCT_PRO_ID: ${{ vars.POLAR_PRODUCT_PRO_ID }}
          POLAR_SANDBOX: ${{ vars.POLAR_SANDBOX }}
          QUIETER_AUTH_MAIL_MODE: ${{ vars.QUIETER_AUTH_MAIL_MODE }}
          QUIETER_AUTH_MAIL_SENDER: ${{ vars.QUIETER_AUTH_MAIL_SENDER }}
          QUIETER_GMAIL_AI_AUTOMATION_ENABLED: ${{ vars.QUIETER_GMAIL_AI_AUTOMATION_ENABLED }}
          QUIETER_PREVIEW_PERSONAS_ENABLED: ${{ vars.QUIETER_PREVIEW_PERSONAS_ENABLED }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VITE_LOGO_DEV_PUBLISHABLE_KEY: ${{ vars.VITE_LOGO_DEV_PUBLISHABLE_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          VITE_QUIETER_PREVIEW_PERSONAS_ENABLED: ${{ vars.VITE_QUIETER_PREVIEW_PERSONAS_ENABLED }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: vp exec sst deploy --config sst.config.ts --stage "$SST_STAGE"

      # Keeps this release's chunks reachable after the next deploy replaces
      # the Worker asset manifest, so tabs opened before it keep loading.
      - name: Archive web assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run archive:web-assets

      - name: Verify deployed web asset archive
        env:
          QUIETER_WEB_ASSET_ARCHIVE_VERIFY_MODE: strict
        run: vp run verify:web-asset-archive

      - name: Rotate legacy Gmail credentials
        if: ${{ env.SST_STAGE == 'production' }}
        env:
          GMAIL_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.GMAIL_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          const token = process.env.GMAIL_CREDENTIAL_ROTATION_TOKEN;
          if (!token) throw new Error("GMAIL_CREDENTIAL_ROTATION_TOKEN is required.");

          const response = await fetch("https://quieter.email/api/internal/gmail-credentials/rotate", {
            headers: { Authorization: `Bearer ${token}` },
            method: "POST",
          });
          const body = await response.text();
          if (!response.ok) {
            throw new Error(`Gmail credential rotation failed with ${response.status}: ${body}`);
          }

          const result = JSON.parse(body);
          console.log(`Rotated ${result.rotated ?? 0} legacy Gmail credential records.`);
          EOF

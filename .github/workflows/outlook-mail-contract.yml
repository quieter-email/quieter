name: Outlook mail contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/outlook-mail.md
      - scripts/verify-outlook-mail-contract.ts
      - .github/workflows/outlook-mail-contract.yml
      - .node-version
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  contract-fixture:
    name: Synthetic auth and read contract
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Vite+ without project dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: false
      - name: Replay the contract fixture
        run: vp exec node scripts/verify-outlook-mail-contract.ts

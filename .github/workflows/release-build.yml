name: Build Runtime Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quieter-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require reviewed public build configuration
        env:
          PUBLIC_CONFIGURATION: ${{ vars.PRODUCTION_RELEASE_PUBLIC_CONFIGURATION }}
        shell: bash
        run: |
          test -n "$PUBLIC_CONFIGURATION" || { echo "Configure PRODUCTION_RELEASE_PUBLIC_CONFIGURATION before building production releases."; exit 1; }

  verify:
    needs: configuration
    uses: ./.github/workflows/ci-main.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      release_stage: production
      public_configuration: ${{ vars.PRODUCTION_RELEASE_PUBLIC_CONFIGURATION }}

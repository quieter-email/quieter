name: Recover interrupted Action cutover

on:
  workflow_dispatch:
    inputs:
      deployment_run:
        description: Original protected SST deployment run ID
        required: true
        type: string
      deployment_attempt:
        description: Original deployment attempt
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: quieter-deploy-production
  cancel-in-progress: false

jobs:
  recover:
    name: Recover verified personal Actions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SST_STAGE: production
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT_RUN: ${{ inputs.deployment_run }}
      DEPLOYMENT_ATTEMPT: ${{ inputs.deployment_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed recovery
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Validate original deployment and elapsed drain
        run: vp exec node scripts/recover-personal-action-cutover.ts prepare

      - name: Install infrastructure type definitions
        run: vp exec sst install --stage "$SST_STAGE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Build deployment configuration
        run: |
          vp run @quieter/observability#build
          vp run quieter#build

      - name: Verify signed mail updates
        timeout-minutes: 2
        run: vp exec sst shell --stage "$SST_STAGE" -- node scripts/check-mail-updates.ts https://updates.quieter.email

      - name: Reverify unchanged consumers and release original fence
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          QUIETER_ALLOW_REMOTE_MIGRATIONS: production
        run: vp exec node scripts/recover-personal-action-cutover.ts release

      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-cutover-recovery
          path: action-cutover-recovery/*.json
          if-no-files-found: ignore
          retention-days: 90

name: Checks

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Generate SST platform types
        run: vp exec sst install --stage ci

      - name: Check
        run: vp check

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Test Node and Cloudflare Worker runtimes
        run: |
          set -m
          vp test --maxWorkers=2 &
          node_pid=$!
          vp run @quieter/cloudflare#test:workers &
          worker_pid=$!
          trap 'kill -- -"$node_pid" -"$worker_pid" 2>/dev/null || true; wait' EXIT

          node_status=0
          worker_status=0
          wait "$node_pid" || node_status=$?
          wait "$worker_pid" || worker_status=$?
          trap - EXIT

          printf 'Node tests exited with %s; Worker tests exited with %s.\n' "$node_status" "$worker_status"
          if [ "$node_status" -ne 0 ] || [ "$worker_status" -ne 0 ]; then
            exit 1
          fi

  deployment-checks:
    name: Deployment safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Check Cloudflare Worker configuration
        run: |
          vp run check:cloudflare
          vp run @quieter/cloudflare#cf-typecheck

      - name: Check package import boundaries
        run: vp run check:boundaries

      - name: Bundle AWS handlers
        run: vp run @quieter/aws#check:bundles

      - name: Bundle Cloudflare workers
        run: vp run @quieter/cloudflare#check:bundles

  web-worker-build:
    name: Web worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Build runtime dependencies
        run: |
          vp run @quieter/observability#build
          vp run quieter#build

      - name: Build web worker
        env:
          SST_WRANGLER_PATH: ${{ github.workspace }}/ci-build-worker.wrangler.jsonc
        run: |
          touch .env.local
          node packages/cloudflare/scripts/write-build-wrangler.ts \
            --name quieter-ci-artifact \
            --main ./apps/web/src/server.ts \
            --out ci-build-worker.wrangler.jsonc
          vp run @quieter/web#build

  migration-integration:
    name: Migration integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTION_CUTOVER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quieter_cutover_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/quieter_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quieter_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Start PostgreSQL with native search compatibility
        run: |
          docker build -f infra/docker/semantic-search-postgres.Dockerfile -t quieter-search-test infra/docker
          docker run -d --name quieter-search-test -e POSTGRES_DB=quieter_migration_test -e POSTGRES_PASSWORD=postgres -p 5432:5432 --health-cmd 'pg_isready -U postgres -d quieter_migration_test' --health-interval 2s --health-timeout 5s --health-retries 30 quieter-search-test
          timeout 70 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} quieter-search-test)" = healthy ]; do sleep 2; done'

      - name: Check committed migrations match the schema
        run: vp run @quieter/database#db:check

      - name: Test committed database migrations
        run: vp run @quieter/database#db:test-migrations

      - name: Build recovery CLI runtime dependency
        run: vp run @quieter/observability#build

      - name: Create isolated Action cutover test database
        run: docker exec quieter-search-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE quieter_cutover_test'

      - name: Test database behavior against migrated PostgreSQL
        run: vp test --no-file-parallelism integration.test.ts credit-accounting.test.ts

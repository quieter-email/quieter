name: Checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quieter-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Generate SST platform types
        run: vp exec sst install --stage ci

      - name: Check
        run: vp check

  tests:
    name: Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Test
        run: vp test

      - name: Test Cloudflare Worker runtime
        run: vp run @quieter/cloudflare#test:workers

      - name: Verify native release fixtures
        run: vp run @quieter/cloudflare#test:release-proofs

  deployment-checks:
    name: Deployment safety checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Check Cloudflare Worker configuration
        run: |
          vp run check:cloudflare
          vp run @quieter/cloudflare#cf-typecheck

      - name: Check backend import boundaries
        run: vp run @quieter/aws#check:boundaries

      - name: Bundle AWS handlers
        run: vp run @quieter/aws#check:bundles

      - name: Bundle Cloudflare workers
        run: vp run @quieter/cloudflare#check:bundles

  web-worker-build:
    name: Web worker build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Build and inventory exact web release bytes
        run: >-
          vp run @quieter/deployment#build:web --directory "${{ github.workspace }}" --output "${{ runner.temp }}/web-release" --stage ci

      - name: Retain verified web build and private source maps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-release
          if-no-files-found: error
          retention-days: 14

  migration-conflict:
    name: Migration conflict check
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      # The drizzle check action invokes its detected package manager directly,
      # so pnpm has to be on PATH ahead of it.
      - name: Enable Corepack
        run: corepack enable

      - name: Check migration conflicts
        uses: drizzle-team/drizzle-orm/actions/check@6adfcd1031726aaf59106ceb36707d85db5e6617
        with:
          working-directory: packages/database
          config: drizzle.config.ts

  migration-integration:
    name: Migration integration tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: quieter_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quieter_migration_test" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/quieter_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quieter_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Check committed migrations match the schema
        run: vp run @quieter/database#db:check

      - name: Test committed database migrations
        run: vp run @quieter/database#db:test-migrations

      - name: Test delivery persistence against migrated PostgreSQL
        run: vp test packages/orpc/tests/organization-mail-delivery.integration.test.ts packages/orpc/tests/private-mailbox.integration.test.ts packages/auth/tests/private-mailbox-account.integration.test.ts

      - name: Test durable mail claims against migrated PostgreSQL
        run: vp test packages/database/tests/mail-outbox.integration.test.ts packages/billing/tests/mail-submission-usage.integration.test.ts packages/orpc/tests/mail-submission-sender.integration.test.ts

      - name: Test durable mail publication through native queues
        run: vp run @quieter/cloudflare#test:workers

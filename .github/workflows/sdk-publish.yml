name: Publish SDK

on:
  workflow_run:
    workflows: [SDK release request]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to publish from packages/sdk/package.json
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-publish-${{ github.event.workflow_run.id || inputs.version }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize SDK revision
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - name: Verify protected main ancestry
        id: revision
        uses: actions/github-script@v8
        with:
          script: |
            let sha = context.sha;
            let tag = '';
            if (context.eventName === 'workflow_run') {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: context.payload.workflow_run.id,
              });
              if (run.event !== 'release' || run.conclusion !== 'success' ||
                  run.path !== '.github/workflows/sdk-release-request.yml' ||
                  run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  !run.head_branch?.startsWith('sdk-v')) {
                throw new Error('An authorized SDK release request is required.');
              }
              sha = run.head_sha;
              tag = run.head_branch;
            }
            const { data } = await github.rest.repos.compareCommits({
              ...context.repo,
              base: sha,
              head: 'main',
            });
            if (data.status !== 'ahead' && data.status !== 'identical') {
              throw new Error('The SDK revision must be reachable from main.');
            }
            if (sha !== context.sha) {
              throw new Error('The SDK revision must match the publishing workflow revision for provenance. Release the current main commit instead.');
            }
            core.info(`Authorized SDK revision: ${sha}`);
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);

  publish:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    name: Publish quieter
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Use latest npm
        run: sudo npm install --global npm@latest

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          WORKFLOW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          expected_version="${WORKFLOW_VERSION:-}"

          if [ -n "${RELEASE_TAG:-}" ]; then
            case "$RELEASE_TAG" in
              sdk-v*) expected_version="${RELEASE_TAG#sdk-v}" ;;
              *) echo "SDK release tags must use sdk-v<version>; got $RELEASE_TAG." >&2; exit 1 ;;
            esac
          fi

          if [ "$package_version" != "$expected_version" ]; then
            echo "packages/sdk/package.json version $package_version does not match $expected_version." >&2
            exit 1
          fi

          if npm view "quieter@$package_version" version >/dev/null 2>&1; then
            echo "quieter@$package_version is already published." >&2
            exit 1
          fi

      - name: Check
        run: |
          vp exec sst install --stage ci
          vp check

      - name: Test
        run: vp test

      - name: Publish
        working-directory: packages/sdk
        run: npm publish --access public --provenance

name: Deploy Runtime Release
run-name: ${{ inputs.mode || 'promote' }} runtime release

on:
  workflow_run:
    workflows: [Build Runtime Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Activate verified uploads or restore a retained healthy release
        type: choice
        options: [promote, rollback]
        required: true
      build_run:
        description: Successful Build Runtime Release run ID for promotion
        type: string
      release_id:
        description: Optional retained release ID for rollback, otherwise the previous healthy release
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && vars.RUNTIME_RELEASE_ENABLED == 'true' && vars.RUNTIME_RELEASE_RECOVERY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    concurrency:
      group: quieter-deploy-${{ vars.RELEASE_STAGE || 'production' }}
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CONTROLLER_SHA: ${{ vars.RELEASE_CONTROLLER_SHA }}
      QUIETER_RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'production' }}
      QUIETER_RELEASE_BUCKET: ${{ vars.RELEASE_JOURNAL_BUCKET }}
      QUIETER_RELEASE_BINDINGS_PARAMETER: ${{ vars.RELEASE_RUNTIME_BINDINGS_PARAMETER }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ARCHIVE_PARENT_KEY_ID: ${{ vars.RELEASE_ARCHIVE_PARENT_KEY_ID }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_URL: ${{ vars.SENTRY_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode || 'promote' }}
      BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
      PUBLIC_CONFIGURATION: ${{ vars.PRODUCTION_RELEASE_PUBLIC_CONFIGURATION }}
      SOURCE_MAP_BINDINGS_PARAMETER: ${{ vars.RELEASE_SOURCE_MAP_BINDINGS_PARAMETER }}
      TARGET_RELEASE_ID: ${{ inputs.release_id }}
      PROBE_TARGETS: ${{ vars.RELEASE_PROBE_TARGETS }}
      ATTEMPT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require reviewed release configuration
        shell: bash
        run: |
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Pin RELEASE_CONTROLLER_SHA to reviewed tooling."; exit 1; }
          test -n "$PROBE_TARGETS" || { echo "Configure reviewed RELEASE_PROBE_TARGETS."; exit 1; }
          if [[ "$RELEASE_MODE" == promote ]]; then
            [[ "$BUILD_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "Promotion requires a successful build run ID."; exit 1; }
            test -n "$PUBLIC_CONFIGURATION" && test -n "$SOURCE_MAP_BINDINGS_PARAMETER"
          fi

      - name: Checkout reviewed controller and source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CONTROLLER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Configure release credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.RELEASE_RUNTIME_AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Construct the complete target release
        id: target
        shell: bash
        run: |
          printf '%s' "$PROBE_TARGETS" > "$RUNNER_TEMP/probe-targets.json"
          if [[ "$RELEASE_MODE" == promote ]]; then
            printf '%s' "$PUBLIC_CONFIGURATION" > "$RUNNER_TEMP/public-configuration.json"
            vp run @quieter/deployment#verify:ci --run "$BUILD_RUN" --stage "$QUIETER_RELEASE_STAGE" --public-config "$RUNNER_TEMP/public-configuration.json" --receipt "$RUNNER_TEMP/source-build.json"
            source_sha=$(jq -er '.build.sourceSha' "$RUNNER_TEMP/source-build.json")
            echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
            vp run @quieter/deployment#operations runtime release plan --source "$source_sha" --output "$RUNNER_TEMP/plan.json"
            jq -e '.runtimeOnly == true and (.affected | length > 0) and all(.services[]; .package == "@quieter/web" or .package == "@quieter/cloudflare")' "$RUNNER_TEMP/plan.json" > /dev/null
            printf '[]' > "$RUNNER_TEMP/upload-ids.json"
            while IFS= read -r service; do
              directory="$RUNNER_TEMP/release-$service"
              selected="$RUNNER_TEMP/selected-$service.json"
              vp run @quieter/deployment#verify:ci --service "$service" --run "$BUILD_RUN" --stage "$QUIETER_RELEASE_STAGE" --public-config "$RUNNER_TEMP/public-configuration.json" --receipt "$selected"
              test "$(jq -er '.build.sourceSha' "$selected")" = "$source_sha"
              gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "$(jq -er '.build.artifactName' "$selected")" --dir "$directory"
              vp run @quieter/deployment#verify:ci --retain --service "$service" --run "$BUILD_RUN" --stage "$QUIETER_RELEASE_STAGE" --public-config "$RUNNER_TEMP/public-configuration.json" --directory "$directory" --artifact-id "$(jq -er '.build.artifactId' "$selected")" --archive-digest "$(jq -er '.build.archiveDigest' "$selected")" --receipt "$RUNNER_TEMP/verified-$service.json"
              QUIETER_RELEASE_BINDINGS_PARAMETER="$SOURCE_MAP_BINDINGS_PARAMETER" vp run @quieter/deployment#operations source-maps upload --directory "$directory" --receipt "$RUNNER_TEMP/maps-$service.json"
              if jq -e '.archive != null' "$directory/artifact.json" > /dev/null; then
                vp run @quieter/deployment#operations runtime archive --directory "$directory" --manifest "$directory/artifact.json" --bucket "$QUIETER_RELEASE_STAGE-archive"
              fi
              vp run @quieter/deployment#operations runtime release register --file "$directory/artifact.json" --directory "$directory"
              upload_id=$(cat /proc/sys/kernel/random/uuid)
              echo "Uploading $service under durable intent $upload_id"
              vp run @quieter/deployment#operations runtime release upload --service "$service" --artifact "$(jq -er '.digest' "$directory/artifact.json")" --attempt "$upload_id" --run "$GITHUB_RUN_ID" --directory "$directory" --output "$RUNNER_TEMP/upload-$service.json"
              jq --arg id "$upload_id" '. + [$id]' "$RUNNER_TEMP/upload-ids.json" > "$RUNNER_TEMP/upload-ids-next.json"
              mv "$RUNNER_TEMP/upload-ids-next.json" "$RUNNER_TEMP/upload-ids.json"
            done < <(jq -er '.affected[]' "$RUNNER_TEMP/plan.json")
            vp run @quieter/deployment#operations runtime release candidate --release "$ATTEMPT_ID" --source "$source_sha" --file "$RUNNER_TEMP/upload-ids.json" --output "$RUNNER_TEMP/candidate.json"
          else
            args=()
            if [[ -n "$TARGET_RELEASE_ID" ]]; then args+=(--release "$TARGET_RELEASE_ID"); fi
            vp run @quieter/deployment#operations runtime release select-rollback "${args[@]}" --output "$RUNNER_TEMP/candidate.json"
          fi

      - name: Prepare and durably record the attempt
        id: prepare
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source-sha }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_MODE" == rollback ]]; then args+=(--rollback); else args+=(--source "$SOURCE_SHA"); fi
          vp run @quieter/deployment#operations runtime release prepare --attempt "$ATTEMPT_ID" --run "$GITHUB_RUN_ID" --file "$RUNNER_TEMP/candidate.json" --targets "$RUNNER_TEMP/probe-targets.json" "${args[@]}"

      - name: Activate and observe the recorded versions
        shell: bash
        run: |
          vp run @quieter/deployment#operations runtime release promote --attempt "$ATTEMPT_ID"
          vp run @quieter/deployment#operations runtime release observe --attempt "$ATTEMPT_ID"

      - name: Restore the baseline after a failed attempt
        if: ${{ failure() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') }}
        shell: bash
        run: vp run @quieter/deployment#operations runtime release recover --attempt "$ATTEMPT_ID" --reason workflow_failed

      - name: Preserve the selected release for review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/upload-*.json
          if-no-files-found: ignore
          retention-days: 14

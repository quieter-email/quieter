name: Deploy landing site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quieter-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing site
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 25
    env:
      SST_STAGE: production
      QUIETER_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      QUIETER_DEPLOY_SURFACE: site
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_URL: ${{ vars.SENTRY_URL }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Install infrastructure type definitions
        run: vp exec sst install --stage "$SST_STAGE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Build deployment configuration
        run: |
          vp run @quieter/observability#build
          vp run quieter#build

      - name: Confirm the landing host is already attached
        run: vp exec node scripts/assert-marketing-host.ts

      - name: Deploy the landing worker
        run: vp run sst deploy --config sst.config.ts --stage "$SST_STAGE"

      - name: Verify the landing page
        timeout-minutes: 5
        run: vp exec node scripts/check-deployment.ts https://quieter.email "$QUIETER_BUILD_ID"

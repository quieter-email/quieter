name: Recover Web Release

on:
  workflow_dispatch:
    inputs:
      deployment_run:
        description: Deployment run with a previous-web artifact for legacy recovery
        required: false
        type: string
      current_version:
        description: Active app Worker version UUID, or router version UUID for legacy recovery
        required: true
        type: string
      compatible_web_only:
        description: I verified only the web code needs recovery and the previous version is compatible with current database, bindings and background jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: quieter-deploy-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && inputs.compatible_web_only
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Resolve production stage credentials
        if: vars.QUIETER_NATIVE_WEB == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - name: Restore the retained native web version
        if: vars.QUIETER_NATIVE_WEB == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          QUIETER_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}
          CURRENT_VERSION: ${{ inputs.current_version }}
        run: vp exec sst shell --stage production -- node scripts/native-web-release.ts rollback "$CURRENT_VERSION"
      - name: Verify and download production recovery record
        if: vars.QUIETER_NATIVE_WEB != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENT_RUN: ${{ inputs.deployment_run }}
        run: |
          [[ "$DEPLOYMENT_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$DEPLOYMENT_RUN" > run.json
          jq -e '.path == ".github/workflows/sst-deploy.yml" and .head_branch == "main" and .status == "completed" and (.event == "push" or .event == "workflow_dispatch")' run.json
          gh run download "$DEPLOYMENT_RUN" --name previous-web --dir recovery
          test "$(jq -r .release recovery/previous-web.json)" = "$(jq -r .head_sha run.json)-$DEPLOYMENT_RUN"
      - name: Restore and verify previous web version
        if: vars.QUIETER_NATIVE_WEB != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CURRENT_VERSION: ${{ inputs.current_version }}
        run: vp exec node scripts/web-recovery.ts restore recovery/previous-web.json "$CURRENT_VERSION"
      - name: Recovery summary
        run: |
          echo 'Restored and verified the retained web release.' >> "$GITHUB_STEP_SUMMARY"

packages:
  - "apps/*"
  - "packages/*"
  - ".agents/skills/poteto-mode/scripts"
  - ".agents/skills/statechart/scripts"

autoInstallPeers: false
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # Several Babel plugins still declare 7.x peer ranges while the workspace
    # runs @babel/core 8.1.3 (the web toolchain already resolved this way).
    "@babel/core": "8.1.3"
    # @shadcn/lint pulls typescript-eslint 8.x, whose peer range caps below
    # the workspace TypeScript. The plugin runs on Oxlint's own AST and the
    # combination is verified working; this only silences the resolver.
    typescript: "7.0.2"
    # drizzle-kit 1.0.0-rc.6 declares optional peer oxc-parser ^0.157.0 while
    # the workspace runs 0.159.0 matching Vite+ 1.7's Oxc parser line.
    "oxc-parser": "0.159.0"


packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # Vite+ replaces Vite with its compatible core under a different version.
    vite: "1.1.0"
    # Several Babel plugins still declare 7.x peer ranges while the workspace
    # runs @babel/core 8.0.7 (the web toolchain already resolved this way).
    "@babel/core": "8.0.7"
    # @shadcn/lint pulls typescript-eslint 8.x, whose peer range caps below
    # the workspace TypeScript. The plugin runs on Oxlint's own AST and the
    # combination is verified working; this only silences the resolver.
    typescript: "7.0.2"
    # Optional UI peers are unused by the isolated Worker test runner.
    "@vitest/ui": "4.1.11 || 5.0.4"
    "@vitest/browser-preview": "4.1.11 || 5.0.4"


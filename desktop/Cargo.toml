[package]
name = "quieter-desktop"
version = "0.1.0"
edition = "2024"
description = "Experimental native GPUI client for quieter"
publish = false

[dependencies]
anyhow = "1.0"
gpui = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }

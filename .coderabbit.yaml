reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
  # Only generated artifacts are withheld. Hand-written code is in scope everywhere,
  # so exclusions here should stay limited to files nobody edits by hand.
  path_filters:
    - "!**/sst-env.d.ts"
    - "!apps/web/src/routeTree.gen.ts"
    - "!pnpm-lock.yaml"
    - "!packages/cloudflare/worker-configuration.d.ts"
    - "!packages/database/drizzle/**/snapshot.json"
    - "!packages/database/drizzle/**/migration.sql"

reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
  path_filters:
    - "!packages/database/drizzle/**/snapshot.json"
    # Keep this PR under CodeRabbit's 100-file review limit. These trees are
    # mostly mechanical bg/fg token renames; restore after the review lands.
    - "!apps/web/src/features/settings/**"
    - "!apps/web/src/features/chat/**"
    - "!apps/web/src/features/home/**"
    - "!apps/web/src/routes/**"
